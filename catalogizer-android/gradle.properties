android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Disable JDK image transform to avoid jlink issues with Java 21
android.useNewJdkImageTransform=false
android.experimental.jdkImageTransform=false
android.enableNewJdkImageTransform=false
android.experimental.useNewJdkImageTransform=false

# Suppress warnings for compile SDK 34
android.suppressUnsupportedCompileSdk=34

# Use Java 17 for compilation to avoid JDK 21 jlink issues
org.gradle.java.version=17

# Enable Gradle Build Cache for faster builds
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Configure Android build features
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Kotlin code style
kotlin.code.style=official
