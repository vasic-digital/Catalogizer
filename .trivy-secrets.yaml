# Trivy Secret Detection Configuration
# Custom secret patterns for Catalogizer

rules:
  # AWS
  - id: aws-access-key-id
    category: AWS
    title: AWS Access Key ID
    severity: CRITICAL
    keywords:
      - aws
      - access
      - key
    regex: (A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}
    allow-rules:
      - id: example-key
        description: Example AWS key pattern
        regex: A[K|S]IA[0-9A-Z]{16}EXAMPLE

  - id: aws-secret-access-key
    category: AWS
    title: AWS Secret Access Key
    severity: CRITICAL
    keywords:
      - aws
      - secret
    regex: (?i)aws(.{0,20})?(?-i)['\"][0-9a-zA-Z\/+]{40}['\"]

  # GitHub
  - id: github-token
    category: GitHub
    title: GitHub Personal Access Token
    severity: CRITICAL
    keywords:
      - github
      - token
      - ghp
    regex: ghp_[0-9a-zA-Z]{36}

  - id: github-oauth
    category: GitHub
    title: GitHub OAuth Access Token
    severity: CRITICAL
    keywords:
      - github
      - oauth
    regex: gho_[0-9a-zA-Z]{36}

  # JWT
  - id: jwt-token
    category: JWT
    title: JWT Token
    severity: HIGH
    keywords:
      - jwt
      - token
      - bearer
    regex: eyJ[A-Za-z0-9_\-\.]+\.[A-Za-z0-9_\-\.]+\.[A-Za-z0-9_\-\.]*
    allow-rules:
      - id: jwt-example
        description: Example JWT tokens
        regex: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9

  # Private Keys
  - id: private-key
    category: Private Key
    title: Private Key
    severity: CRITICAL
    keywords:
      - private
      - key
      - rsa
      - dsa
      - ec
    regex: (?i)(-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----)

  # Database Connection Strings
  - id: postgres-connection
    category: Database
    title: PostgreSQL Connection String
    severity: HIGH
    keywords:
      - postgres
      - postgresql
      - connection
    regex: postgres(?:ql)?://[^:]+:[^@]+@[^/]+/[^\s\"']+
    allow-rules:
      - id: postgres-example
        description: Example PostgreSQL URLs
        regex: postgres://user:pass@localhost/db

  - id: mysql-connection
    category: Database
    title: MySQL Connection String
    severity: HIGH
    keywords:
      - mysql
      - connection
    regex: mysql://[^:]+:[^@]+@[^/]+/[^\s\"']+

  # API Keys
  - id: generic-api-key
    category: API Key
    title: Generic API Key
    severity: HIGH
    keywords:
      - api
      - key
      - token
    regex: (?i)(api[_-]?key|apikey)\s*[:=]\s*['\"][0-9a-zA-Z\-_]{16,}['\"]

  # Passwords in URLs
  - id: url-with-password
    category: Password
    title: URL with Password
    severity: HIGH
    keywords:
      - http
      - https
      - password
    regex: (http|https|ftp|sftp)://[^:]+:[^@]+@[^/]+[/]?

  # Slack
  - id: slack-token
    category: Slack
    title: Slack Token
    severity: CRITICAL
    keywords:
      - slack
      - token
    regex: xox[baprs]-[0-9a-zA-Z]{10,48}

  # OpenAI
  - id: openai-api-key
    category: OpenAI
    title: OpenAI API Key
    severity: CRITICAL
    keywords:
      - openai
      - api
      - sk-
    regex: sk-[a-zA-Z0-9]{48}

  # Anthropic
  - id: anthropic-api-key
    category: Anthropic
    title: Anthropic API Key
    severity: CRITICAL
    keywords:
      - anthropic
      - claude
      - sk-ant
    regex: sk-ant-[a-zA-Z0-9_-]{32,}

# Disable built-in rules if needed (use with caution)
# disable-anchors: false

# Allow rules for false positives
allow-rules:
  - id: example-credentials
    description: Example/test credentials
    regex: (example|test|sample|dummy|fake).*(password|key|token|secret)

  - id: placeholder-values
    description: Placeholder values in documentation
    regex: (YOUR_|INSERT_|REPLACE_).*(API_KEY|TOKEN|SECRET|PASSWORD)

  - id: env-vars
    description: Environment variable references
    regex: \$\{?[A-Z_]+_?(KEY|TOKEN|SECRET|PASSWORD)\}?

  - id: config-keys
    description: Configuration key names (not values)
    regex: (api_key|apikey|secret|token)_(name|field|variable|setting)
