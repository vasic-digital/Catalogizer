version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-androidtv-negative-paths.json
test_cases:
- id: neg-tv-cold-start-low-ram
  name: Cold Start on Low-RAM Device (2GB)
  category: launch-lifecycle
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Simulate low RAM conditions
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App launches within 5 seconds despite memory constraints. Splash screen
      appears without black screen gap
    timeout: 10
  - name: Verify home screen renders
    action: 'sleep: 3000'
    expected: Home screen renders with focus on first item. Image loading may be slower
      but layout is correct. No OutOfMemoryError crash
    timeout: 10
- id: neg-tv-launch-ethernet-disconnected
  name: Launch With Ethernet Disconnected
  category: launch-lifecycle
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Disconnect ethernet
    action: adb_shell:unplug ethernet cable from tv device or  svc ethernet disable
    expected: Device has no network connectivity
    timeout: 10
  - name: Launch app
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App launches and shows clear offline state message centered on screen.
      Message is readable from 10-foot viewing distance. No crash, no infinite loading
      spinner
    timeout: 10
  - name: Reconnect and retry
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: App detects connectivity restoration and loads content. Retry button
      is focusable and activatable with D-pad center
    timeout: 10
- id: neg-tv-launch-after-system-update
  name: Launch After System OTA Update
  category: launch-lifecycle
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Launch after system update reboot
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App launches normally. Database and SharedPreferences survive system
      update. No crash from changed system APIs or missing runtime permissions after
      update
    timeout: 10
  - name: Verify session and data
    action: 'screenshot'
    expected: Login session is preserved if tokens have not expired. Server URL and
      preferences intact. Cached images may need reload but no data corruption
    timeout: 10
- id: neg-tv-hdmi-cec-power-conflict
  name: HDMI-CEC Power-On Launch Conflict
  category: launch-lifecycle
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Trigger CEC power-on during app launch
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App handles the HDMI input switching and CEC power-on events without
      crashing. Display may briefly show black during input switch
    timeout: 10
  - name: Verify app is functional after CEC
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: App responds to D-pad input. UI is fully rendered. No stuck black screen
      from HDMI handshake timing
    timeout: 10
- id: neg-tv-launch-input-switching
  name: Launch From TV Input Switching
  category: launch-lifecycle
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Switch HDMI inputs while app is running
    action: 'sleep: 10000'
    expected: App resumes correctly when input switches back. No blank screen. Media
      playback that was active is paused and can be resumed
    timeout: 10
- id: neg-tv-screensaver-interruption
  name: Screensaver Interruption During Idle
  category: launch-lifecycle
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Let screensaver activate
    action: 'sleep: 30000'
    expected: Screensaver takes over display
    timeout: 10
  - name: Dismiss screensaver
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: App returns to the exact screen it was on before screensaver. Focus
      is restored to the last focused element. No activity recreation errors. No stale
      WebSocket connections
    timeout: 10
- id: neg-tv-memory-pressure-kill
  name: Memory Pressure Kill and Restore
  category: launch-lifecycle
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Navigate to detail screen
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: User is on detail screen
    timeout: 10
  - name: Simulate low memory kill
    action: adb_shell:am kill com.catalogizer.androidtv
    expected: Process is killed
    timeout: 10
  - name: Restore from recents
    action: 'keypress: KEYCODE_ENTER'
    expected: App restores gracefully. Either returns to the detail screen via saved
      state or navigates to home screen. No crash from null ViewModel state. Focus
      is on a valid UI element
    timeout: 10
- id: neg-tv-launch-overscan
  name: Launch With Display Overscan Active
  category: launch-lifecycle
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Set overscan on display
    action: 'sleep: 2000'
    expected: App renders with content within the overscan-safe area (inner 90% of
      screen)
    timeout: 10
  - name: Verify critical UI visible
    action: 'screenshot'
    expected: All interactive elements and text are within the title-safe area. No
      buttons or menu items hidden behind screen edges. Focus indicators are fully
      visible
    timeout: 10
- id: neg-tv-dpad-rapid-input
  name: Very Rapid D-Pad Input (20+ Per Second)
  category: dpad-navigation
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Send rapid D-pad events
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: Focus moves through items smoothly. App does not freeze, crash, or drop
      frames excessively. Key repeat rate is handled by throttling or debouncing
    timeout: 10
  - name: Stop rapid input
    action: 'sleep: 1000'
    expected: Focus settles on a valid item. No overscroll past the last item. UI
      is responsive immediately after stopping
    timeout: 10
- id: neg-tv-dpad-during-loading
  name: D-Pad Navigation During Loading Transition
  category: dpad-navigation
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Press select on item
    action: 'keypress: KEYCODE_ENTER'
    expected: Loading transition begins
    timeout: 10
  - name: Press D-pad during transition
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Input is either queued and applied after load, or ignored during transition.
      No crash from focus moving to elements that do not exist yet. No navigation
      to wrong screen
    timeout: 10
- id: neg-tv-focus-lost-after-dialog
  name: Focus Lost After Dialog Dismissal
  category: dpad-navigation
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Open a dialog
    action: 'keypress: KEYCODE_MENU'
    expected: Dialog appears with focus on a dialog button
    timeout: 10
  - name: Dismiss dialog
    action: 'keypress: KEYCODE_ENTER'
    expected: Focus returns to the element that triggered the dialog, or to the nearest
      logical focusable element. Focus is NEVER lost entirely (no invisible focus
      state). D-pad input works immediately after dismissal
    timeout: 10
- id: neg-tv-focus-invisible-element
  name: Focus Trapped on Invisible Element
  category: dpad-navigation
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Navigate to screen with conditional visibility
    action: 'keypress: KEYCODE_DPAD_UP'
    expected: Screen loads with some elements gone/invisible
    timeout: 10
  - name: Attempt to focus hidden area
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Focus skips invisible elements and lands on the next visible focusable
      element. No focus trap where D-pad input has no visible effect. No crash from
      focusing a GONE view
    timeout: 10
- id: neg-tv-focus-wraparound
  name: Focus Wrap-Around at List Boundaries
  category: dpad-navigation
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Navigate to first item in row
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: First item has visible focus
    timeout: 10
  - name: Press D-pad left at boundary
    action: 'keypress: KEYCODE_DPAD_LEFT'
    expected: Focus either stays on the first item (no wrap) or wraps to the navigation
      sidebar. It does NOT wrap to the last item in the row. Behavior is consistent
      and predictable
    timeout: 10
  - name: Navigate to last item and press right
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: Focus stays on last item or moves to next logical target. No crash from
      index out of bounds. No wrap to first item (unless explicitly designed)
    timeout: 10
- id: neg-tv-dpad-during-animation
  name: D-Pad Input During Row Scroll Animation
  category: dpad-navigation
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Start scrolling animation
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: Scroll animation begins
    timeout: 10
  - name: Press D-pad during animation
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: Second input is queued or the animation accelerates to the next item.
      Focus lands on the correct item. No visual glitch from interrupted animation.
      No item skipping
    timeout: 10
- id: neg-tv-long-press-dpad
  name: Long Press D-Pad Center Button
  category: dpad-navigation
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Long press on media item
    action: 'keypress: KEYCODE_ENTER'
    expected: If long-press menu is implemented, context menu appears. If not implemented,
      single press action fires once (not repeatedly). No crash from unhandled long
      press event
    timeout: 10
- id: neg-tv-simultaneous-buttons
  name: Simultaneous Multiple Button Press
  category: dpad-navigation
  priority: low
  platforms:
  - androidtv
  steps:
  - name: Press multiple remote buttons simultaneously
    action: adb_shell:press d-pad center and back simultaneously (possible with some
      remotes or via  input keyevent --longpress keycode_dpad_center keycode_back)
    expected: App handles conflicting simultaneous key events gracefully. Either one
      takes priority or both are processed in order. No crash from concurrent event
      handling
    timeout: 10
- id: neg-tv-auth-onscreen-keyboard-lag
  name: Login With On-Screen Keyboard Lag
  category: authentication
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Open login screen
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Login screen with on-screen keyboard visible
    timeout: 10
  - name: Type slowly with D-pad
    action: 'keypress: KEYCODE_ENTER'
    expected: Each character appears in the field as selected. No characters dropped.
      No cursor position jump. D-pad focus on keyboard is clearly visible at 10-foot
      distance
    timeout: 10
  - name: Navigate to password field
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Focus moves to password field. On-screen keyboard reappears for password.
      Username value is preserved
    timeout: 10
- id: neg-tv-auth-external-keyboard
  name: Login With External USB/Bluetooth Keyboard
  category: authentication
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Connect external keyboard
    action: 'sleep: 1000'
    expected: Keyboard is recognized by system
    timeout: 10
  - name: Type credentials with physical keyboard
    action: 'keypress: KEYCODE_ENTER'
    expected: Text input works correctly. Tab moves between fields in logical order
      (server URL > username > password > login button). Enter on login button submits
      the form. No focus conflict between keyboard and on-screen keyboard
    timeout: 10
- id: neg-tv-auth-slow-network-timeout
  name: Login Timeout on Slow TV Network
  category: authentication
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Simulate slow network
    action: 'sleep: 5000'
    expected: Login request is sent, loading indicator visible
    timeout: 10
  - name: Wait for timeout
    action: 'sleep: 30000'
    expected: Timeout error message displayed in large, TV-readable text. Login button
      is re-enabled. No ANR from blocking main thread. User can retry immediately
    timeout: 10
- id: neg-tv-auth-server-url-trailing-spaces
  name: Server URL With Trailing Spaces
  category: authentication
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Enter server URL with trailing spaces
    action: 'text: http://192.168.0.100:8080   '
    expected: App trims whitespace before making connection. Login succeeds if server
      is reachable at the trimmed URL. No connection error from malformed URL with
      spaces
    timeout: 10
- id: neg-tv-auth-protocol-mismatch
  name: Server URL With Protocol Mismatch
  category: authentication
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Enter HTTPS URL for HTTP server
    action: 'text: https://192.168.0.100:8080'
    expected: Connection fails with clear error message about protocol mismatch or
      SSL handshake failure. Suggests trying HTTP. No crash from SSLException
    timeout: 10
  - name: Enter HTTP URL for HTTPS server
    action: 'text: http://192.168.0.100:8080'
    expected: Connection either auto-upgrades to HTTPS or shows clear error with suggestion.
      No silent downgrade that leaks credentials
    timeout: 10
- id: neg-tv-auth-session-expire-during-playback
  name: Session Expires During Active Media Playback
  category: authentication
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Start media playback
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Media is playing
    timeout: 10
  - name: Wait for token expiry during playback
    action: 'sleep: 3000'
    expected: Currently buffered content continues to play. When next API call fails
      with 401, playback pauses and a non-intrusive re-login prompt appears. Does
      not abruptly cut to login screen mid-scene. Allows user to re-authenticate and
      resume
    timeout: 10
- id: neg-tv-auth-relogin-password-change
  name: Re-Login After Server-Side Password Change
  category: authentication
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Change password on server
    action: 'adb_shell: curl -s -X PUT http://localhost:8080/api/v1/auth/password -H "Content-Type: application/json" -d "{\"password\":\"newpass123\"}"'
    expected: TV app continues with existing token until it expires
    timeout: 10
  - name: Token expires and re-login needed
    action: 'sleep: 5000'
    expected: App redirects to login screen. User enters new password. Login succeeds
      with new password. Old password no longer works. Clear error if old password
      is used
    timeout: 10
- id: neg-tv-auth-certificate-warning
  name: Login With Self-Signed Server Certificate
  category: authentication
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Connect to server with self-signed cert
    action: 'text: https://192.168.0.100:8443'
    expected: App shows certificate warning that is readable on TV screen. Provides
      option to accept/trust the certificate for development. Does not silently accept
      untrusted certificates. Does not crash from CertPathValidatorException
    timeout: 10
- id: neg-tv-media-4k-on-1080p
  name: Play 4K Content on 1080p Device
  category: media
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Open 4K media file
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Player downscales 4K content to device resolution. Playback starts without
      decoder error. Quality is acceptable at lower resolution
    timeout: 10
  - name: Verify no performance issues
    action: 'frame_diff: 2000'
    expected: If device hardware can handle 4K decode with downscale, playback is
      smooth. If hardware cannot cope, app gracefully shows message suggesting a lower
      quality version rather than showing slideshow-like playback
    timeout: 10
- id: neg-tv-media-unsupported-codec
  name: Play Unsupported Codec (HEVC on Old Device)
  category: media
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Attempt to play HEVC/H.265 on non-HEVC device
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: 'App detects unsupported codec and shows clear error: ''This video format
      (HEVC) is not supported by your device''. No crash from MediaCodec initialization
      failure. Suggests alternative if available'
    timeout: 10
- id: neg-tv-media-quality-downgrade
  name: Streaming Quality Downgrade on Bandwidth Drop
  category: media
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Start high quality stream
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Video plays at high quality
    timeout: 10
  - name: Reduce bandwidth mid-stream
    action: 'sleep: 5000'
    expected: Player detects reduced bandwidth and buffers. If adaptive streaming
      is supported, quality reduces gracefully. Playback continues rather than failing.
      Buffer indicator visible to user
    timeout: 10
- id: neg-tv-media-audio-delay-soundbar
  name: Audio Delay With External Sound Bar
  category: media
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Play media with HDMI ARC soundbar
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Video and audio play
    timeout: 10
  - name: Check audio sync
    action: 'frame_diff: 2000'
    expected: If audio delay adjustment is available in settings, user can compensate.
      Player does not add its own additional delay. Audio passthrough mode (if supported)
      minimizes latency
    timeout: 10
- id: neg-tv-media-subtitle-large-font
  name: Subtitle Rendering With Large System Font
  category: media
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Set large accessibility font
    action: 'adb_shell: settings put system font_scale 2.0'
    expected: Font scale is increased system-wide
    timeout: 10
  - name: Play video with subtitles
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Subtitles are rendered at increased size per system setting. Subtitles
      remain within the video bounds and do not overflow off screen. Long subtitle
      lines wrap correctly. No overlap with player controls
    timeout: 10
- id: neg-tv-media-corrupted-info
  name: Media Info for Corrupted or Incomplete File
  category: media
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Open info for corrupted file
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Detail screen shows whatever metadata is available (title from filename,
      file size). Fields that cannot be read show 'Unknown' or 'N/A'. No crash from
      FFprobe/MediaExtractor failure
    timeout: 10
  - name: Attempt to play corrupted file
    action: 'keypress: KEYCODE_DPAD_UP'
    expected: 'Player shows error message: ''Unable to play this file''. Returns to
      detail screen on Back press. No stuck loading state'
    timeout: 10
- id: neg-tv-media-resume-invalid-position
  name: Resume Playback at Invalid Position After Crash
  category: media
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Save invalid resume position
    action: 'adb_shell: am force-stop com.catalogizer.androidtv'
    expected: Resume position (60 min) is saved from previous session
    timeout: 10
  - name: Relaunch and resume
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Player detects that saved position (60 min) exceeds file duration (30
      min). Falls back to playing from beginning rather than seeking to invalid position.
      No crash from seek beyond EOF
    timeout: 10
- id: neg-tv-media-pause-30-minutes
  name: Pause Playback for Over 30 Minutes Then Resume
  category: media
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Pause playback
    action: 'keypress: KEYCODE_MEDIA_PLAY_PAUSE'
    expected: Video is paused. Screensaver may activate
    timeout: 10
  - name: Resume after long pause
    action: 'keypress: KEYCODE_MEDIA_PLAY_PAUSE'
    expected: Playback resumes from paused position. Network connection to server
      is re-established if it was dropped. Buffer refills. No crash from stale connection
      or expired session. If session expired, re-auth prompt appears
    timeout: 10
- id: neg-tv-remote-disconnect
  name: Remote Control Disconnects During Operation
  category: remote-control
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Use Bluetooth remote normally
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: App responds to remote input
    timeout: 10
  - name: Remote disconnects
    action: 'sleep: 5000'
    expected: App continues running. No crash from missing input device. When remote
      reconnects, app responds immediately. No queued input events from disconnect/reconnect
      causing unexpected navigation
    timeout: 10
- id: neg-tv-remote-ir-interference
  name: IR Remote Interference From Other Devices
  category: remote-control
  priority: low
  platforms:
  - androidtv
  steps:
  - name: Use app with IR remote active
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: App only responds to valid key events from its paired remote. Stray
      IR signals do not cause unintended navigation. No crash from unexpected key
      codes
    timeout: 10
- id: neg-tv-remote-bluetooth-low-battery
  name: Bluetooth Remote Low Battery Behavior
  category: remote-control
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Use remote with low battery
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: App handles intermittent key events gracefully. Missed key presses do
      not leave app in inconsistent state. No half-processed navigation actions
    timeout: 10
  - name: Remote drops and reconnects
    action: 'sleep: 3000'
    expected: Focus state is preserved. App continues from where it was. No focus
      lost to invisible element
    timeout: 10
- id: neg-tv-remote-media-key-non-media
  name: Media Remote Keys on Non-Media Screen
  category: remote-control
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Press play/pause on home screen
    action: 'keypress: KEYCODE_HOME'
    expected: App either starts playing the focused item or ignores the key gracefully.
      No crash from unhandled media key event. No KeyEvent dispatching error
    timeout: 10
  - name: Press rewind/fast-forward on settings
    action: 'keypress: KEYCODE_MEDIA_FAST_FORWARD'
    expected: Keys are ignored on non-media screens. No crash. No unexpected navigation
    timeout: 10
- id: neg-tv-remote-channel-buttons
  name: Channel Up/Down on Non-Live Content
  category: remote-control
  priority: low
  platforms:
  - androidtv
  steps:
  - name: Press channel up/down during VOD browsing
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Buttons are either ignored or mapped to page up/down scrolling. No crash
      from unhandled KEYCODE_CHANNEL_UP/DOWN. No attempt to tune to a TV channel
    timeout: 10
- id: neg-tv-remote-voice-search-failure
  name: Voice Search Failure Graceful Handling
  category: remote-control
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Trigger voice search
    action: 'keypress: KEYCODE_SEARCH'
    expected: Voice search intent is sent to Catalogizer if it handles voice search
    timeout: 10
  - name: Voice recognition fails
    action: 'keypress: KEYCODE_SEARCH'
    expected: If app handles voice search, it shows 'Could not understand' message.
      If app does not handle voice search intent, system handles the failure. No crash
      from empty or malformed voice search result
    timeout: 10
- id: neg-tv-remote-home-during-playback
  name: Home Button During Playback Saves State
  category: remote-control
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Play media and press Home
    action: 'keypress: KEYCODE_HOME'
    expected: Playback pauses. Player position (15 min) is saved. App goes to background
      cleanly
    timeout: 10
  - name: Return to app
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App resumes to player screen with video paused at the 15-minute mark.
      Resume prompt shows if applicable. Player resources are properly re-initialized
    timeout: 10
- id: neg-tv-remote-recent-apps
  name: Recent Apps Button Handling
  category: remote-control
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Open recent apps during use
    action: 'keypress: KEYCODE_HOME'
    expected: Android TV recent apps overlay appears. Catalogizer shows correct preview
      thumbnail (not black screen). App state is preserved
    timeout: 10
  - name: Return from recents
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App resumes to exact previous state. No activity recreation from thumbnail.
      Focus is on the last focused element
    timeout: 10
- id: neg-tv-display-10ft-small-text
  name: 10-Foot UI Small Text Verification
  category: display
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Audit all text sizes
    action: 'screenshot'
    expected: All body text is at least 14sp. Titles are at least 18sp. No text smaller
      than 12sp anywhere. All text is readable from 10-foot viewing distance on a
      40-inch display
    timeout: 10
  - name: Check error messages
    action: 'screenshot'
    expected: Error messages use same minimum font sizes. Error text is not in low-contrast
      colors. Readable from couch distance
    timeout: 10
- id: neg-tv-display-hdr-metadata
  name: HDR Content Metadata Handling
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Play HDR content on SDR display
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Player tone-maps HDR to SDR range. Colors appear reasonable (not washed
      out or oversaturated). No crash from unsupported HDR metadata
    timeout: 10
  - name: Play HDR content on HDR display
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: HDR mode is activated if supported. Display switches to HDR processing.
      UI overlay elements remain visible (not blown out by HDR brightness)
    timeout: 10
- id: neg-tv-display-refresh-rate
  name: Display Refresh Rate Switching
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Play 24fps content on 60Hz display
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Player either uses frame rate matching to switch display to 24Hz (if
      supported and enabled) or applies 3:2 pulldown. No visible stuttering from frame
      rate mismatch
    timeout: 10
  - name: Exit player after refresh rate switch
    action: 'keypress: KEYCODE_BACK'
    expected: Display refresh rate returns to default (60Hz). UI animations are smooth.
      No stuck refresh rate from player not cleaning up
    timeout: 10
- id: neg-tv-display-frame-drops-navigation
  name: Frame Drops During Row Navigation
  category: display
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Navigate rows with many items
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Frame rate stays above 30fps during navigation. Image loading happens
      asynchronously and does not block UI thread. Placeholder images shown while
      loading. No visible jank or hitching during row transitions
    timeout: 10
- id: neg-tv-display-4x3-on-16x9
  name: 4:3 Content on 16:9 Display
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Play 4:3 aspect ratio content
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Video displays with pillarbox (black bars on left and right). Content
      is not stretched to fill 16:9. Aspect ratio is preserved. Pillarbox bars are
      clean black, not gray or noisy
    timeout: 10
- id: neg-tv-display-letterbox-pillarbox
  name: Letterbox and Pillarbox Rendering
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Play ultra-wide content
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Video displays with letterbox bars (black bars top and bottom). Video
      is centered vertically. Player controls overlay the letterbox area, not the
      video content
    timeout: 10
  - name: Play tall content
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Video displays with large pillarbox bars. Content is centered and not
      distorted. No crash from unusual aspect ratios
    timeout: 10
- id: neg-tv-display-overscan-safe-area
  name: Overscan Safe Area Compliance
  category: display
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Check all screen edges
    action: 'screenshot'
    expected: All text, buttons, focus indicators, and interactive elements are within
      the title-safe area (inner 90% of screen). Background images may extend to edges.
      Media rows have horizontal padding from screen edges
    timeout: 10
  - name: Check focused item at edges
    action: 'keypress: KEYCODE_DPAD_RIGHT'
    expected: Focus indicator and item content are fully visible even on TVs with
      overscan. No focus ring clipped by screen edge
    timeout: 10
- id: neg-tv-display-subtitle-ui-overlap
  name: Subtitle Overlap With Player UI Elements
  category: display
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Play video with subtitles and show controls
    action: 'keypress: KEYCODE_MEDIA_PLAY_PAUSE'
    expected: When player controls are visible, subtitles shift upward to avoid being
      hidden behind the seek bar and control buttons. Subtitles are readable at all
      times
    timeout: 10
  - name: Hide controls
    action: 'sleep: 5000'
    expected: Subtitles return to their default position at the bottom of the video.
      No rendering glitch during transition
    timeout: 10
- id: neg-tv-display-contrast-bright-content
  name: UI Theme Contrast With Bright Video Content
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Show UI over bright content
    action: 'keypress: KEYCODE_DPAD_CENTER'
    expected: Player controls have sufficient contrast against bright video (semi-transparent
      dark background behind controls). Play/pause, seek bar, and time text are clearly
      visible. Focus indicator is visible against any video content
    timeout: 10
  - name: Check info overlay on bright poster
    action: 'screenshot'
    expected: Title text over or near bright thumbnails remains readable. Text has
      shadow, outline, or background scrim for contrast
    timeout: 10
- id: neg-tv-display-loading-spinner-performance
  name: Loading Spinner Performance on Slow GPU
  category: display
  priority: medium
  platforms:
  - androidtv
  steps:
  - name: Trigger loading state on low-end device
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Loading spinner animates smoothly (not jerky). Spinner does not consume
      excessive GPU resources. Animation uses hardware layer or simple rotation rather
      than complex shader effects
    timeout: 10
  - name: Multiple loading states simultaneously
    action: 'keypress: KEYCODE_DPAD_DOWN'
    expected: Loading indicators do not stack up and consume all GPU resources. Previous
      loading states are properly cancelled. No visual artifacts from overlapping
      spinners
    timeout: 10
- id: neg-tv-display-focus-indicator-visibility
  name: Focus Indicator Visibility on All Backgrounds
  category: display
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Check focus on dark backgrounds
    action: 'screenshot'
    expected: Focus indicator (highlight border, scale effect, or glow) is visible
      against dark content. Contrast ratio meets WCAG AA minimum
    timeout: 10
  - name: Check focus on light backgrounds
    action: 'screenshot'
    expected: Focus indicator is equally visible against light content. Uses a technique
      (shadow, contrasting border, background tint) that works universally regardless
      of thumbnail colors
    timeout: 10
  - name: Check focus on empty/placeholder items
    action: 'screenshot'
    expected: Focus indicator is visible on placeholder items. User can always tell
      which item has focus, even before images load
    timeout: 10
