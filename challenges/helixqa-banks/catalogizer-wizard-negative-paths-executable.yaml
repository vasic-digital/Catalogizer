    expected: Test fails with timeout/network error, wizard remains usable, retry
      available
    timeout: 10
- id: neg-wizard-progress-persist-crash
  name: Progress Survives App Crash
  category: resilience
  priority: medium
  platforms:
  - desktop
  steps:
