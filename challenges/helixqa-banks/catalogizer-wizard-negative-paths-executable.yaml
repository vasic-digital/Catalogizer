    timeout: 10
- id: neg-wizard-offline-during-test
  name: Network Drops During Connection Test
  category: resilience
  priority: high
  platforms:
  - desktop
  steps:
  - name: Lose network during test
    action: '# TODO: Convert to executable - start connection test, then disconnect
