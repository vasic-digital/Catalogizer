    action: 'tap: 960,540'
    expected: Scan stops, resources released, wizard returns to previous state
    timeout: 10
- id: neg-wizard-smb-special-chars-password
  name: SMB Password with Special Characters
  category: validation
  priority: high
  platforms:
  - desktop
  steps:
  - name: Enter special password
    action: '# TODO: Convert to executable - enter password ''p@$$w0rd!#%&*()'' in
      smb config'
    expected: Password accepted and used correctly in connection test
    timeout: 10
- id: neg-wizard-nfs-root-export
  name: NFS Root Export Path
  category: security
  priority: critical
  platforms:
  - desktop
  steps:
  - name: Enter root export
    action: '# TODO: Convert to executable - enter ''/'' as nfs export path'
