version: "2.0"
name: "Catalogizer Android TV - FULL EXECUTABLE Test Suite"
description: "Complete test suite with ACTUAL ADB commands - no text descriptions"

test_cases:
  # =====================================
  # LAUNCH TESTS
  # =====================================
  - id: tv-force-stop
    name: "Force Stop App"
    category: launch
    priority: critical
    platforms: [androidtv]
    steps:
      - name: "Kill app process"
        action: "adb_shell: am force-stop com.catalogizer.androidtv"
        expected: "App killed"
        timeout: 5
        
  - id: tv-cold-start
    name: "Cold Start - Full Launch Sequence"
    category: launch
    priority: critical
    platforms: [androidtv]
    dependencies: [tv-force-stop]
    steps:
      - name: "Wait after force stop"
        action: "sleep: 2000"
        expected: "Process terminated"
        
      - name: "Launch app"
        action: "adb_shell: am start -n com.catalogizer.androidtv/.ui.MainActivity"
        expected: "Activity started"
        timeout: 5
        
      - name: "Wait 15s for black screen (app loading)"
        action: "sleep: 15000"
        expected: "App loading"
        
      - name: "Screenshot - check for splash"
        action: "screenshot"
        expected: "Splash screen visible or black"
        vision_verify: true
        
      - name: "Wait 5s more for splash"
        action: "sleep: 5000"
        expected: "Splash displays"
        
      - name: "Screenshot - verify splash"
        action: "screenshot"
        expected: "Splash screen with Catalogizer logo"
        vision_verify: true
        
      - name: "Wait 5s more for login"
        action: "sleep: 5000"
        expected: "Login screen appears"
        
      - name: "Screenshot - verify login screen"
        action: "screenshot"
        expected: "Login screen with Username, Password fields"
        vision_verify: true

  # =====================================
  # LOGIN TESTS
  # =====================================
  - id: tv-login-complete
    name: "Login - Full Credential Entry"
    category: authentication
    priority: critical
    platforms: [androidtv]
    dependencies: [tv-cold-start]
    steps:
      - name: "Navigate to username field"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Username focused"
        timeout: 2
        
      - name: "Select username"
        action: "keypress: KEYCODE_ENTER"
        expected: "Field active"
        timeout: 2
        
      - name: "Type admin"
        action: "text: admin"
        expected: "Username entered"
        timeout: 3
        
      - name: "Screenshot - username entered"
        action: "screenshot"
        expected: "Username field shows 'admin'"
        vision_verify: true
        
      - name: "Navigate to password"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Password focused"
        timeout: 2
        
      - name: "Select password"
        action: "keypress: KEYCODE_ENTER"
        expected: "Field active"
        timeout: 2
        
      - name: "Type password"
        action: "text: admin123"
        expected: "Password entered"
        timeout: 3
        
      - name: "Screenshot - credentials entered"
        action: "screenshot"
        expected: "Both fields populated"
        vision_verify: true
        
      - name: "Navigate to login button"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Login button focused"
        timeout: 2
        
      - name: "Click login"
        action: "keypress: KEYCODE_ENTER"
        expected: "Login submitted"
        timeout: 5
        
      - name: "Wait for home screen"
        action: "sleep: 10000"
        expected: "Home loads"
        
      - name: "Screenshot - verify home screen"
        action: "screenshot"
        expected: "Home screen with media content, NOT login"
        vision_verify: true

  # =====================================
  # NAVIGATION TESTS
  # =====================================
  - id: tv-nav-home
    name: "Navigate Home Screen"
    category: navigation
    priority: high
    platforms: [androidtv]
    dependencies: [tv-login-complete]
    steps:
      - name: "Navigate right"
        action: "keypress: KEYCODE_DPAD_RIGHT"
        expected: "Focus moves right"
        timeout: 2
        
      - name: "Navigate right again"
        action: "keypress: KEYCODE_DPAD_RIGHT"
        expected: "Focus moves"
        timeout: 2
        
      - name: "Screenshot"
        action: "screenshot"
        expected: "Different element focused"
        vision_verify: true
        
      - name: "Navigate down"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Focus moves down"
        timeout: 2
        
      - name: "Navigate down again"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Focus moves"
        timeout: 2
        
      - name: "Screenshot"
        action: "screenshot"
        expected: "New row focused"
        vision_verify: true

  # =====================================
  # BACKGROUND/RESUME TESTS
  # =====================================
  - id: tv-background-resume
    name: "Background and Resume"
    category: integration
    priority: high
    platforms: [androidtv]
    dependencies: [tv-login-complete]
    steps:
      - name: "Press home"
        action: "keypress: KEYCODE_HOME"
        expected: "App backgrounds"
        timeout: 3
        
      - name: "Screenshot - Android TV home"
        action: "screenshot"
        expected: "Android TV launcher visible"
        vision_verify: true
        
      - name: "Wait 2s"
        action: "sleep: 2000"
        expected: "App in background"
        
      - name: "Resume app"
        action: "adb_shell: am start -n com.catalogizer.androidtv/.ui.MainActivity"
        expected: "App resumes"
        timeout: 5
        
      - name: "Wait 3s"
        action: "sleep: 3000"
        expected: "App visible"
        
      - name: "Screenshot - verify still logged in"
        action: "screenshot"
        expected: "Home screen visible, NOT login"
        vision_verify: true

  # =====================================
  # ERROR HANDLING TESTS
  # =====================================
  - id: tv-login-invalid
    name: "Login - Invalid Credentials"
    category: authentication
    priority: high
    platforms: [androidtv]
    dependencies: [tv-force-stop]
    steps:
      - name: "Launch fresh"
        action: "adb_shell: am start -n com.catalogizer.androidtv/.ui.MainActivity"
        expected: "App launches"
        timeout: 5
        
      - name: "Wait for login"
        action: "sleep: 20000"
        expected: "Login visible"
        
      - name: "Focus username"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Username focused"
        timeout: 2
        
      - name: "Select username"
        action: "keypress: KEYCODE_ENTER"
        expected: "Field active"
        timeout: 2
        
      - name: "Type wrong username"
        action: "text: wronguser"
        expected: "Username entered"
        timeout: 3
        
      - name: "Navigate to password"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Password focused"
        timeout: 2
        
      - name: "Select password"
        action: "keypress: KEYCODE_ENTER"
        expected: "Field active"
        timeout: 2
        
      - name: "Type wrong password"
        action: "text: wrongpass"
        expected: "Password entered"
        timeout: 3
        
      - name: "Navigate to login"
        action: "keypress: KEYCODE_DPAD_DOWN"
        expected: "Login focused"
        timeout: 2
        
      - name: "Click login"
        action: "keypress: KEYCODE_ENTER"
        expected: "Login submitted"
        timeout: 5
        
      - name: "Wait for error"
        action: "sleep: 3000"
        expected: "Error displayed"
        
      - name: "Screenshot - error visible"
        action: "screenshot"
        expected: "Error message visible, still on login"
        vision_verify: true
