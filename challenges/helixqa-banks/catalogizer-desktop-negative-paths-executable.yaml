version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-desktop-negative-paths.json
test_cases:
- id: neg-desktop-crash-recovery
  name: Crash Recovery State Restore
  category: resilience
  priority: critical
  platforms:
  - desktop
  steps:
  - name: Force kill during operation
    action: '# TODO: Convert to executable - kill catalogizer desktop process while
      browsing library'
    expected: Process terminates immediately
    timeout: 10
  - name: Relaunch app
    action: '# TODO: Convert to executable - launch catalogizer desktop again'
    expected: App launches normally, previous state partially restored, no corruption
      errors
    timeout: 10
- id: neg-desktop-offline-launch
  name: Launch Without Network
  category: resilience
  priority: high
  platforms:
  - desktop
  steps:
  - name: Disconnect network
    action: '# TODO: Convert to executable - disable all network interfaces'
    expected: Network is down
    timeout: 10
  - name: Launch app
    action: '# TODO: Convert to executable - start catalogizer desktop'
    expected: App launches, shows connection error with retry button, no crash
    timeout: 10
- id: neg-desktop-invalid-server-url
  name: Invalid Server URL in Settings
