  platforms:
  - desktop
  steps:
  - name: Enter invalid URL
    action: '# TODO: Convert to executable - set server url to ''not-a-url'' in settings'
    expected: Validation error shown, URL not saved
    timeout: 10
- id: neg-desktop-server-url-xss
  name: XSS in Server URL Field
  category: security
  priority: critical
  platforms:
  - desktop
  steps:
  - name: Enter XSS payload
    action: '# TODO: Convert to executable - set server url to ''<script>alert(1)</script>''
      in settings'
    expected: Input sanitized, no script execution, validation error displayed
    timeout: 10
- id: neg-desktop-ipc-timeout
