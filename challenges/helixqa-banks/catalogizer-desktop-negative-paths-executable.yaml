    action: '# TODO: Convert to executable - request large file operation via ipc'
    expected: Operation times out gracefully with user-friendly error, app remains
      responsive
    timeout: 10
- id: neg-desktop-ipc-rapid-fire
  name: Rapid IPC Command Flooding
  category: performance
