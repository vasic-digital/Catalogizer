version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-androidtv-comprehensive.json
test_cases:
- id: tv-cold-start
  name: TV Cold Start Launch
  category: launch
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Force stop app
    action: adb_shell:am force-stop com.vasic.catalogizer.tv
    expected: App process terminated
    timeout: 10
  - name: Launch from launcher
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: App launches and displays splash screen within 3 seconds
    timeout: 10
- id: tv-splash-screen
  name: TV Splash Screen Display
  category: launch
  priority: high
  platforms:
  - androidtv
  steps:
  - name: Launch app
    action: 'adb_shell: am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Splash screen appears with app logo and loading indicator
    timeout: 10
  - name: Splash completes
    action: 'sleep: 3000'
    expected: Splash transitions to home screen or login within 5 seconds
    timeout: 10
- id: tv-home-focus
  name: TV Home Initial Focus
  category: launch
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Launch to home
    action: 'sleep: 3000'
    expected: Home screen loads
    timeout: 10
  - name: Verify initial focus
    action: 'screenshot'
    expected: First focusable media item in top row has visible focus indicator
    timeout: 10
- id: tv-login-page
  name: TV Login Page Display
  category: authentication
  priority: critical
  platforms:
  - androidtv
  steps:
  - name: Open app without session
    action: 'adb_shell: pm clear com.catalogizer.androidtv && am start -n com.catalogizer.androidtv/.MainActivity'
    expected: Login screen renders with server URL, username, password fields and
      login button
    timeout: 10
  - name: Verify TV layout
    action: 'screenshot'
    expected: Fields and labels are large enough for 10-foot viewing experience
    timeout: 10
- id: tv-login-dpad-nav
