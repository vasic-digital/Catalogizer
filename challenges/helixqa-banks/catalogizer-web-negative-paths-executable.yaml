version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-web-negative-paths.json
test_cases:
- id: neg-web-login-xss-username
  name: XSS Injection in Username Field
  category: login-auth-negative
  priority: critical
  platforms:
  - web
  steps:
  - name: Enter XSS payload in username
    action: 'text: xss'
    expected: Input is sanitized or escaped, no script execution occurs, error message
      shows sanitized text without rendering HTML, no alert dialog appears
    timeout: 10
  - name: Verify DOM integrity
    action: '# TODO: Convert to executable - inspect the dom around the username field
      and any error message elements'
    expected: No injected script tags in the DOM, error message uses textContent not
      innerHTML, React JSX escaping prevents XSS
    timeout: 10
- id: neg-web-login-xss-password
  name: XSS Injection in Password Field
  category: login-auth-negative
  priority: critical
  platforms:
  - web
  steps:
  - name: Enter XSS payload in password
    action: '# TODO: Convert to executable - type "><img src=x onerror=alert(1)> into
      the password field and submit'
    expected: Input is treated as plain text, no image element created, no onerror
      fires, form shows invalid credentials error safely
    timeout: 10
- id: neg-web-login-extremely-long-password
  name: Extremely Long Password (10000+ chars)
