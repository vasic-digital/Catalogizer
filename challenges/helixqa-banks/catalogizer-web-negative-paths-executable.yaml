- id: neg-web-login-session-hijack-token-edit
  name: Session Hijacking via Manual Token Edit
  category: login-auth-negative
  priority: critical
  platforms:
  - web
  steps:
  - name: Modify JWT token in localStorage
    action: '# TODO: Convert to executable - login as admin, then manually edit the
      jwt token payload in localstorage (change username to ''superadmin'' or modify
      role claims), then refresh the page'
    expected: Modified token fails JWT signature verification on next API call, user
      is logged out and redirected to /login, tampered token is cleared
    timeout: 10
  - name: Replace with fabricated token
    action: '# TODO: Convert to executable - set localstorage token to a completely
      fabricated jwt string signed with a wrong secret'
    expected: All API calls return 401 Unauthorized, AuthProvider detects invalid
      token and redirects to /login
    timeout: 10
