  priority: high
  platforms:
  - web
  steps:
  - name: Paste extremely long password
    action: '# TODO: Convert to executable - paste a 10000-character string into the
      password field and submit the form'
    expected: Form either truncates input to a reasonable limit or submits and receives
      a 400/413 error from the API, UI does not freeze or crash, no browser tab hang
    timeout: 10
  - name: Verify UI responsiveness
    action: '# TODO: Convert to executable - attempt to interact with other page elements
      during and after paste'
    expected: Page remains responsive, no excessive memory consumption, no visible
      layout shift from the password field
    timeout: 10
- id: neg-web-login-network-offline
  name: Login Attempt While Network Offline
  category: login-auth-negative
  priority: critical
  platforms:
  - web
  steps:
  - name: Disconnect network and attempt login
    action: 'tap: 960,540'
    expected: Login request fails, user sees a clear network error message such as
      'Network error' or 'Unable to connect to server', submit button re-enables,
      no infinite spinner
    timeout: 10
  - name: Reconnect and retry
    action: 'tap: 960,540'
    expected: Login succeeds on retry, redirect to /dashboard, credentials were preserved
      in form fields
    timeout: 10
- id: neg-web-login-expired-saved-token
