      expired jwt (exp claim in the past), then navigate to /dashboard'
    expected: AuthProvider detects expired token, user is redirected to /login page,
      expired token is cleared from localStorage
    timeout: 10
  - name: Verify no flash of authenticated content
    action: '# TODO: Convert to executable - observe the transition from load to redirect'
    expected: No dashboard content flashes before redirect, loading state or blank
      screen shown during auth check, then clean redirect to /login
    timeout: 10
- id: neg-web-login-redirect-loop
  name: Redirect Loop After Login Prevention
  category: login-auth-negative
  priority: critical
  platforms:
  - web
  steps:
  - name: Navigate to /login with returnUrl pointing to /login
    action: '# TODO: Convert to executable - navigate to /login?returnurl=%2flogin'
    expected: After successful login, user is redirected to /dashboard (default) instead
      of /login, no infinite redirect loop occurs
    timeout: 10
  - name: Test deeply nested redirect
    action: '# TODO: Convert to executable - navigate to /login?returnurl=%2flogin%3freturnurl%3d%252flogin'
    expected: Redirect loop is detected and broken, user lands on /dashboard
    timeout: 10
