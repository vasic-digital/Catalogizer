version: '2.0'
name: Test Suite - EXECUTABLE
description: Executable test suite - converted from /run/media/milosvasic/DATA4TB/Projects/Catalogizer/challenges/helixqa-banks/catalogizer-android-negative-paths.json
test_cases:
- id: neg-android-crash-recovery-anr
  name: Crash Recovery After ANR Dialog
  category: launch-lifecycle
  priority: critical
  platforms:
  - android
  steps:
  - name: Trigger ANR condition
    action: adb_shell:am start -n com.catalogizer.android/.MainActivity &&  input keyevent
      keycode_wakeup && sleep 1 &&  kill -stop $( pidof com.catalogizer.android)
    expected: System ANR dialog appears after ~5 seconds indicating app is not responding
    timeout: 10
  - name: Dismiss ANR and wait
    action: adb_shell:tap 'wait' on anr dialog, then resume process with  kill -cont
    expected: App resumes to its previous state without data loss or blank screen
    timeout: 10
  - name: Verify app functional after ANR
    action: '# TODO: Convert to executable - navigate to any media list screen and
      scroll'
    expected: App responds normally, no frozen UI, no repeated ANR dialogs
    timeout: 10
- id: neg-android-launch-low-storage
  name: Launch With Low Storage Below 50MB Free
  category: launch-lifecycle
  priority: high
  platforms:
  - android
  steps:
  - name: Reduce available storage
    action: '# TODO: Convert to executable - fill device storage until less than 50mb
      remains free, then launch catalogizer'
    expected: App launches successfully despite low storage
    timeout: 10
  - name: Verify graceful warning
    action: '# TODO: Convert to executable - check for any low storage notification
      or in-app warning'
    expected: App displays a non-blocking warning about low storage rather than crashing.
      Core browse and search features remain functional
    timeout: 10
  - name: Attempt cache write operation
    action: '# TODO: Convert to executable - browse media items to trigger image caching'
    expected: App handles cache write failures gracefully, shows placeholder images
      instead of crashing with IOException
    timeout: 10
- id: neg-android-launch-no-network
  name: Launch With No Network Connectivity
  category: launch-lifecycle
  priority: critical
  platforms:
  - android
  steps:
  - name: Disable all network
    action: adb_shell:svc wifi disable &&  svc data disable
    expected: Device has no network connectivity
    timeout: 10
  - name: Launch app
    action: adb_shell:am start -n com.catalogizer.android/.MainActivity
    expected: App launches and displays a clear offline state message instead of crash
      or infinite loading spinner
    timeout: 10
  - name: Verify offline UI
    action: '# TODO: Convert to executable - check screen content for error handling
      ui'
    expected: App shows 'No connection' or 'Server unreachable' message with a retry
      button. No unhandled exception dialog
    timeout: 10
  - name: Restore network and retry
    action: adb_shell:svc wifi enable && tap retry button
    expected: App reconnects and loads content normally within 10 seconds
    timeout: 10
