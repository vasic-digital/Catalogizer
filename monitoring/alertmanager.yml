# AlertManager Configuration for Catalogizer
# https://prometheus.io/docs/alerting/configuration/

global:
  # The default SMTP smarthost used for sending emails
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@catalogizer.local'
  smtp_auth_username: ''
  smtp_auth_password: ''
  
  # The default Slack API URL
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # The default VictorOps API URL
  victorops_api_url: ''
  
  # The default PagerDuty URL
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  
  # Resolve timeout
  resolve_timeout: 5m

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each incoming alert enters.
route:
  # The default receiver
  receiver: 'default'
  
  # The labels by which incoming alerts are grouped together.
  group_by: ['alertname', 'severity', 'service']
  
  # Whether an alert should continue matching subsequent sibling nodes.
  continue: false
  
  # When a new group of alerts is created by an incoming alert, wait at least
  # 'group_wait' to send the initial notification.
  group_wait: 30s
  
  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 5m
  
  # If an alert has successfully been sent, wait 'repeat_interval' to resend them.
  repeat_interval: 4h
  
  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 1h
      continue: true
    
    # High severity alerts
    - match:
        severity: high
      receiver: 'high-alerts'
      group_wait: 10s
      repeat_interval: 2h
      continue: true
    
    # Security alerts
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 1h
      continue: true
    
    # Database alerts
    - match_re:
        service: database|postgres|mysql|sqlite
      receiver: 'dba-team'
      group_wait: 30s
      continue: true
    
    # API/Backend alerts
    - match_re:
        service: api|backend|catalog-api
      receiver: 'backend-team'
      group_wait: 30s
      continue: true
    
    # Frontend alerts
    - match_re:
        service: web|frontend|catalog-web
      receiver: 'frontend-team'
      group_wait: 30s
      continue: true

# Inhibition rules allow to mute a set of alerts given that another alert is firing.
inhibit_rules:
  # If a critical alert is firing, inhibit warning level alerts with the same alertname
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']
  
  # If a node is down, inhibit alerts from that node
  - source_match:
      alertname: NodeDown
    target_match_re:
      alertname: .+
    equal: ['instance']

# Receivers define notification integrations
receivers:
  # Default receiver - log to file
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
  
  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#critical-alerts'
        send_resolved: true
        title: '🔴 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        actions:
          - type: button
            text: 'View Dashboard'
            url: 'http://grafana:3000/d/critical-alerts'
    email_configs:
      - to: 'oncall@catalogizer.local'
        send_resolved: true
        subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
    # Uncomment to enable PagerDuty
    # pagerduty_configs:
    #   - service_key: '<pagerduty-integration-key>'
    #     severity: critical
    #     description: '{{ .GroupLabels.alertname }}'
  
  # High severity alerts
  - name: 'high-alerts'
    slack_configs:
      - channel: '#high-priority-alerts'
        send_resolved: true
        title: '🟠 HIGH: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          {{ end }}
    email_configs:
      - to: 'alerts@catalogizer.local'
        send_resolved: true
        subject: '[HIGH] {{ .GroupLabels.alertname }}'
  
  # Security team alerts
  - name: 'security-team'
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: '🔒 SECURITY: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Security Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
    email_configs:
      - to: 'security@catalogizer.local'
        send_resolved: true
        subject: '[SECURITY] {{ .GroupLabels.alertname }}'
  
  # DBA team alerts
  - name: 'dba-team'
    slack_configs:
      - channel: '#database-alerts'
        send_resolved: true
        title: '🗄️ DATABASE: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Database Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
  
  # Backend team alerts
  - name: 'backend-team'
    slack_configs:
      - channel: '#backend-alerts'
        send_resolved: true
        title: '⚙️ BACKEND: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Backend Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
  
  # Frontend team alerts
  - name: 'frontend-team'
    slack_configs:
      - channel: '#frontend-alerts'
        send_resolved: true
        title: '🎨 FRONTEND: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Frontend Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

# Time intervals for mute timing
# Can be used to suppress alerts during maintenance windows
mute_time_intervals:
  - name: maintenance
    time_intervals:
      - times:
          - start_time: '02:00'
            end_time: '04:00'
        weekdays: ['sunday']
        location: 'UTC'
