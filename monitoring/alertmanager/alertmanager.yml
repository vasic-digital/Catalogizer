global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@catalogizer.local'

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: 'critical'
      receiver: 'critical-alerts'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@catalogizer.local'
        headers:
          Subject: 'Catalogizer Alert: {{ .GroupLabels.alertname }}'

  - name: 'webhook-notifications'
    webhook_configs:
      - url: 'http://localhost:8080/api/v1/admin/webhooks/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@catalogizer.local'
        headers:
          Subject: 'CRITICAL Catalogizer Alert: {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://localhost:8080/api/v1/admin/webhooks/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']